# Test-only overrides. The .env file is loaded in WildwestApiApplication.main(),
# which @SpringBootTest does not call, so the ${...} placeholders in
# application.yml need values here. These are dummies, not real credentials.
# A .properties file at the same location takes precedence over application.yml,
# so the rest of application.yml (datasource, flyway, ...) still applies.

wildwest.jwt.secret=test-only-jwt-secret-at-least-32-bytes-long
wildwest.jwt.expiration-hours=1

wildwest.stripe.secret-key=sk_test_dummy
wildwest.stripe.publishable-key=pk_test_dummy
wildwest.stripe.webhook-secret=whsec_dummy

wildwest.paystack.secret-key=sk_test_dummy
wildwest.paystack.public-key=pk_test_dummy
wildwest.paystack.webhook-secret=dummy
wildwest.paystack.currency=KES
wildwest.paystack.usd-to-kes-rate=128.0

wildwest.payment.default-provider=PAYSTACK

wildwest.dev.ngrok.enabled=false

wildwest.image.cloudinary.cloud-name=dummy
wildwest.image.cloudinary.api-key=dummy
wildwest.image.cloudinary.api-secret=dummy
