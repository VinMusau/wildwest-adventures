spring:
  application:
    name: wildwest-api
  datasource:
    url: jdbc:postgresql://localhost:5432/wildwest
    username: wildwest
    password: wildwest
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG

wildwest:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS}