spring:
  application:
    name: wildwest-api
  datasource:
    url: jdbc:postgresql://localhost:5432/wildwest
    username: wildwest
    password: wildwest
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG

wildwest:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS}
  
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}

  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY}
    public-key: ${PAYSTACK_PUBLIC_KEY}
    webhook-secret: ${PAYSTACK_WEBHOOK_SECRET}
    currency: ${PAYSTACK_CURRENCY}
    usd-to-kes-rate: ${USD_TO_KES_RATE}
  
  payment:
    default-provider: ${PAYMENT_DEFAULT_PROVIDER}

  dev:
    ngrok:
      enabled: ${NGROK_ENABLED:true}
      auth-token: ${NGROK_AUTH_TOKEN:}
      binary: ${NGROK_BINARY:ngrok}
      port: ${NGROK_PORT:8080}
      url: ${NGROK_URL:}\

  image:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}