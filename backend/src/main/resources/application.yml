spring:
  application:
    name: wildwest-api
  datasource:
    url: jdbc:postgresql://localhost:5432/wildwest
    username: wildwest
    password: wildwest
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Outgoing email (booking confirmations). Any SMTP provider works; see wildwest.mail below.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG

wildwest:
  # Base URL of the frontend, used for links in emails.
  app-url: ${APP_URL:http://localhost:5173}

  mail:
    # Booking emails are off until this is true and MAIL_HOST is set.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}

  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS}
  
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}

  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY}
    public-key: ${PAYSTACK_PUBLIC_KEY}
    webhook-secret: ${PAYSTACK_WEBHOOK_SECRET}
    currency: ${PAYSTACK_CURRENCY}
    usd-to-kes-rate: ${USD_TO_KES_RATE}
  
  payment:
    default-provider: ${PAYMENT_DEFAULT_PROVIDER}

  dev:
    ngrok:
      enabled: ${NGROK_ENABLED:true}
      auth-token: ${NGROK_AUTH_TOKEN:}
      binary: ${NGROK_BINARY:ngrok}
      port: ${NGROK_PORT:8080}
      url: ${NGROK_URL:}

  image:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}