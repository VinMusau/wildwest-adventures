services:
  db:
    image: postgres:17-alpine
    container_name: wildwest-db
    environment:
      POSTGRES_DB: wildwest
      POSTGRES_USER: wildwest
      POSTGRES_PASSWORD: wildwest
    ports:
      - "5432:5432"
    volumes:
      - wildwest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildwest -d wildwest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wildwest_pgdata: