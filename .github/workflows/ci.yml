name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (format, lint, compile, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # The tests are @SpringBootTest against a real Postgres, with the same
    # database, user and password as docker-compose.yml and application.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wildwest
          POSTGRES_USER: wildwest
          POSTGRES_PASSWORD: wildwest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wildwest -d wildwest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # check = spotlessCheck (format) + compileJava/compileTestJava with
      # -Xlint:all -Werror (lint, types) + test.
      - name: ./gradlew check
        run: ./gradlew check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  frontend:
    name: Frontend (format, lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Format (oxfmt)
        run: npm run format:check

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npx vite build
